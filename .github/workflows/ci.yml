name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,   gate_size: true,  build_msi: true  }
          - { os: macos-latest,   rid: osx-arm64, gate_size: false, build_msi: false }
          - { os: ubuntu-latest,  rid: linux-x64, gate_size: false, build_msi: false }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: 'Stickies.csproj'

      - name: Restore
        run: dotnet restore

      - name: Publish AOT (with warning gate)
        shell: bash
        run: |
          dotnet publish -c Release -r ${{ matrix.rid }} --no-restore \
            -p:TreatWarningsAsErrors=true \
            -p:WarningsNotAsErrors=IL2104

      - name: Strip native AOT pdbs from Windows publish output
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Remove-Item "bin\Release\net9.0\win-x64\publish\*.pdb" -Force -ErrorAction SilentlyContinue

      - name: Size budget (Windows)
        if: matrix.gate_size
        shell: pwsh
        run: |
          $publishDir = "bin\Release\net9.0\win-x64\publish"
          $exe = (Get-Item "$publishDir\Stickies.exe").Length
          $dir = (Get-ChildItem $publishDir -Recurse | Measure-Object Length -Sum).Sum
          Write-Host "Stickies.exe: $([math]::Round($exe/1MB,2)) MB  /  publish/: $([math]::Round($dir/1MB,2)) MB"
          if ($exe -gt 18MB) { throw "Stickies.exe = $exe bytes (> 18MB cap)" }
          if ($dir -gt 30MB) { throw "publish/ total = $dir bytes (> 30MB cap)" }

      - name: Build MSI (validation only — no upload)
        if: matrix.build_msi
        run: |
          dotnet build installer/Stickies.wixproj -c Release `
            -p:Version=0.0.0
